on: [push]
jobs:
  build_and_static_analysis:
    runs-on: ubuntu-latest
    container:
      image: faiz0511211/msp430-gcc-9.3.1.11:latest
    steps:
      - name: Checkout the repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout $GITHUB_SHA
      -run: make
      -run: make cppcheck
        
